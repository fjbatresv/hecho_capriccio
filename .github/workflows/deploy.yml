name: Deploy to S3

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  SENTRY_RELEASE: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Inject Sentry DSN y release en index.html
        if: env.SENTRY_DSN != ''
        run: |
          RELEASE=${SENTRY_RELEASE:-${GITHUB_SHA}}
          perl -0pi -e "s|(<meta name=\"sentry-dsn\" content=\")[^\"]*(\"\\s*/?>)|\\1${SENTRY_DSN}\\2|" index.html
          perl -0pi -e "s|(<meta name=\"sentry-release\" content=\")[^\"]*(\"\\s*/?>)|\\1${RELEASE}\\2|" index.html

      - name: Instalar sentry-cli
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Publicar release en Sentry y subir sourcemaps
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
        run: |
          RELEASE=${SENTRY_RELEASE:-${GITHUB_SHA}}
          sentry-cli releases new "$RELEASE"
          sentry-cli releases set-commits --auto "$RELEASE"
          if ls assets/**/*.map >/dev/null 2>&1 || ls **/*.map >/dev/null 2>&1; then
            sentry-cli releases files "$RELEASE" upload-sourcemaps . \
              --url-prefix "~/" \
              --ext map --ext js --validate --rewrite
          else
            echo "No hay sourcemaps para subir a Sentry."
          fi
          sentry-cli releases finalize "$RELEASE"

      - name: Compress images
        run: |
          npm install --no-save imagemin-cli imagemin-mozjpeg imagemin-pngquant
          npx imagemin assets/img/* --out-dir=assets/img

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Activos estáticos: cache largo e inmutable
          aws s3 sync . s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store" \
            --exclude "README.md" \
            --exclude "node_modules/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          # HTML: cache corto para poder invalidar con despliegues
          aws s3 sync . s3://${{ env.S3_BUCKET }} \
            --exclude "*" \
            --include "index.html" \
            --cache-control "public,max-age=300,s-maxage=600"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
