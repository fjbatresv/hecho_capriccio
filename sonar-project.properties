# Configuración base para SonarCloud
sonar.projectKey=fjbatresv_hecho_capriccio
sonar.projectName=Hecho Capriccio
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.organization=fjbatresv

sonar.sources=.
sonar.exclusions=assets/**,node_modules/**,.github/**
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**
sonar.coverage.exclusions=__tests__/**,**/*.test.js,eslint.config.js,jest.config.cjs

# Ruta opcional a reportes de cobertura cuando existan
sonar.javascript.lcov.reportPaths=coverage/lcov.info
